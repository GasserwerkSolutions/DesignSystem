version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      browser-tooling:
        patterns: ["puppeteer", "playwright", "axe-core"]
      build-tooling:
        patterns: ["esbuild", "postcss", "typescript", "@types/node"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
