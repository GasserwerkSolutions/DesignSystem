name: One-time visual baseline candidate capture

on:
  push:
    branches:
      - fix/visual-goldens-reviewed
    paths:
      - .github/workflows/visual-baseline-once.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies and browser system libraries
        run: |
          npm ci
          bash scripts/install-browser-deps.sh
      - name: Preserve original screenshots for bounded review
        run: |
          mkdir -p /tmp/designsystem-goldens
          cp tests/visual/*.png /tmp/designsystem-goldens/
      - name: Capture current main behavior, no CSS edits
        run: node scripts/check-visual.js --update
      - name: Quantify every old-to-new visual difference before committing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { PNG } = require('pngjs');
          (async () => {
            const pixelmatch = (await import('pixelmatch')).default;
            let total = 0;
            const report = [];
            for(const tone of ['trust','playful','premium','industrial','modern','minimal']) {
              for(const mode of ['light','dark']) {
                const name = tone + '-' + mode + '.png';
                const prior = PNG.sync.read(fs.readFileSync(path.join('/tmp/designsystem-goldens',name)));
                const next = PNG.sync.read(fs.readFileSync(path.join('tests/visual',name)));
                if(prior.width!==next.width || prior.height!==next.height) {
                  throw Error(name + ': screenshot dimensions changed; manual investigation required');
                }
                const pixels = pixelmatch(prior.data,next.data,null,prior.width,prior.height,{threshold:0.1});
                const ratio = pixels/(prior.width*prior.height);
                console.log('GOLDEN REVIEW',name,'changed pixels:',pixels,'ratio:',(ratio*100).toFixed(4)+'%');
                if(pixels > 2500 || ratio > 0.0002) {
                  throw Error(name + ': unexpected visual drift; do not commit screenshots');
                }
                total += pixels;
                report.push({name,pixels,width:prior.width,height:prior.height,percentage:+(ratio*100).toFixed(5)});
              }
            }
            fs.writeFileSync('/tmp/designsystem-golden-review.json',JSON.stringify(report,null,2));
            console.log('REVIEW BOUND PASSED: 12 screenshots, '+total+' changed pixels; no dimensions changed');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit proposed PNG updates to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/*.png tests/visual/.metadata.json
          git diff --cached --stat
          test "$(git diff --cached --name-only | grep -cE '^tests/visual/.*(png|json)$')" -ge 12
          git commit -m "test(visual): capture canonical main-rendered snapshot candidates"
          git push origin HEAD:fix/visual-goldens-reviewed
      - name: Confirm candidate baselines are stable on the same browser host
        run: |
          node scripts/check-visual.js
          npm run check:generated
