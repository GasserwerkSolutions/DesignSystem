name: One-time integration dist rebuild

on:
  push:
    branches:
      - integration/designsystem-contracts-15-18
    paths:
      - .github/workflows/integration-dist-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild on pinned integration sources
        run: |
          npm ci
          npm run build
          npm run check:form
          node scripts/check-prose-contract.js
          node scripts/check-card-contract.js
          npm audit --audit-level=high
      - name: Commit generated outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u dist/
          if git diff --cached --quiet; then
            echo "No dist changes needed"
          else
            git diff --cached --stat
            git commit -m "build: synchronise generated CSS and tokens for integration"
            git push origin HEAD:integration/designsystem-contracts-15-18
          fi
      - name: Confirm committed artifacts are reproducible
        run: npm run check:generated
