name: One-time generated CSS sync for PR 15

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync-generated:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/defined-min-radius-2' &&
      github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the reviewed PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild committed distribution from source
        run: |
          npm ci
          npm run build
          npm run check:form
      - name: Commit only generated dist assets back to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "build(designsystem): regenerate pinned dist from source"
          git push origin HEAD:refs/heads/fix/defined-min-radius-2
