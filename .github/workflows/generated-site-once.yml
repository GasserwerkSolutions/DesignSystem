name: One-time generated docs/site sync

on:
  push:
    branches:
      - fix/visual-goldens-reviewed
    paths:
      - .github/workflows/generated-site-once.yml

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build all outputs using current committed source
        run: |
          npm ci
          npm run build
          npm run build:site
      - name: Commit only reproducible dist/site assets, with strict path allowlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u dist/site/
          git add dist/site/assets/ds/semantic/form.css
          git diff --cached --stat
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const names = execFileSync('git', ['diff','--cached','--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed = new Set([
            'dist/site/assets/ds/base/layout.css',
            'dist/site/assets/ds/base/typography.css',
            'dist/site/assets/ds/components/button.css',
            'dist/site/assets/ds/components/card.css',
            'dist/site/assets/ds/components/section.css',
            'dist/site/assets/ds/main.css',
            'dist/site/assets/ds/patterns/hero.css',
            'dist/site/assets/ds/patterns/service-grid.css',
            'dist/site/assets/ds/semantic/semantic.css',
            'dist/site/foundations.html',
            'dist/site/assets/ds/semantic/form.css'
          ]);
          const unexpected = names.filter(x=>!allowed.has(x));
          if(unexpected.length || names.length !== 11) {
            console.error('Generated site diff failed strict allowlist:',{unexpected,names});
            process.exitCode=1;
          } else console.log('PASS: exactly 11 expected dist/site artifacts');
          NODE
          git commit -m "build: resynchronise generated documentation site assets"
          git push origin HEAD:fix/visual-goldens-reviewed
      - name: Verify regenerated assets match the committed tree
        run: npm run check:generated
