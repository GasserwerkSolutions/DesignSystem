name: One-time visual parity against main

on:
  push:
    branches:
      - integration/designsystem-contracts-15-18
    paths:
      - .github/workflows/integration-visual-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Exact pre-integration main
        uses: actions/checkout@v4
        with:
          ref: d539cc5a19e187bb820d07acd4d1bb071edb21fa
          path: baseline
      - name: Candidate snapshot
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Setup Node and dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install identical browser environment
        run: |
          cd baseline && npm ci
          cd ../candidate && npm ci
          bash scripts/install-browser-deps.sh
      - name: Render all 12 variants on the exact same host
        run: |
          (cd baseline && node scripts/check-visual.js --update)
          (cd candidate && node scripts/check-visual.js --update)
      - name: Compare candidate and main output (not stale goldens)
        working-directory: candidate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { PNG } = require('pngjs');
          (async () => {
            const pixelmatch = (await import('pixelmatch')).default;
            let failures = 0;
            for (const tone of ['trust','playful','premium','industrial','modern','minimal']) {
              for (const mode of ['light','dark']) {
                const key = tone + '-' + mode + '.png';
                const a = PNG.sync.read(fs.readFileSync(path.join('../baseline/tests/visual', key)));
                const b = PNG.sync.read(fs.readFileSync(path.join('tests/visual', key)));
                if(a.width !== b.width || a.height !== b.height) {
                  console.error('FAIL', key, 'dimensions', a.width, a.height, b.width, b.height);
                  failures++;
                  continue;
                }
                const diff = pixelmatch(a.data, b.data, null, a.width, a.height, {threshold: 0.1});
                console.log('PARITY', key, diff, 'pixels');
                if(diff > 500) failures++;
              }
            }
            if(failures) { console.error('VISUAL PARITY FAILED:', failures); process.exitCode = 1; }
            else console.log('PASS: all 12 modes have <=500px differences against main on same runner');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
