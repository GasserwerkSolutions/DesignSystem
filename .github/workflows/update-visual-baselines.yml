name: Update Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-visual-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: bash scripts/install-browser-deps.sh

      - name: Build JavaScript and tokens
        run: npm run build

      - name: Update visual baselines
        run: npm run check:visual:update

      - name: Verify visual baselines
        run: npm run check:visual

      - name: Upload reviewable baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidate-${{ github.run_id }}
          path: tests/visual
          if-no-files-found: error
