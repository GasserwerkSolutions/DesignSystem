name: TEMP sync Aussage generated assets
on:
  push:
    branches: [integration/aussage-on-current-main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/integration/aussage-on-current-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce exact generated-file allowlist
        run: |
          python3 - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(
            ["git","status","--porcelain","--untracked-files=all","--","dist"],
            text=True).splitlines())
          files = set()
          for line in actual:
            if not line:
              continue
            files.add(line[3:].strip())
          allowed = {"dist/main.min.css", "dist/bundle-stats.json"}
          unexpected = files - allowed
          print("Changed generated files:", sorted(files))
          if unexpected:
            raise SystemExit("Unexpected generated files: "+str(sorted(unexpected)))
          if not files:
            print("All dist files already reproduced.")
          PY
      - name: Commit exact generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/main.min.css dist/bundle-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate bounded Aussage CSS artifacts"
            git push origin HEAD:integration/aussage-on-current-main
          fi
